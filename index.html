
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تلویزیون زنده</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:14px;background:#222;font-size:22px}
main{padding:12px}
select,button{font-size:18px;padding:12px;margin:6px;border-radius:7px}
select{width:90%;max-width:450px}
button{background:#1684d8;color:white;border:0}
video{width:100%;max-height:65vh;background:black;margin-top:12px}
#status{color:#ffd36a;margin:12px;overflow-wrap:anywhere;direction:ltr;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<header>تلویزیون زنده</header>
<main>
<select id="channels">
<option>در حال دریافت شبکه‌ها...</option>
</select>
<br>
<button onclick="play()">پخش شبکه</button>
<button onclick="full()">تمام صفحه</button>
<video id="video" controls playsinline></video>
<div id="status">در حال دریافت فهرست شبکه‌ها...</div>
</main>

<script>
var source="https://raw.githubusercontent.com/kgkaku/IRIB-Live-Channels-Playlist/main/irib.json";
var worker="https://bold-morning-b7ca.akbariebad98.workers.dev/";
var select=document.getElementById("channels");
var video=document.getElementById("video");
var statusBox=document.getElementById("status");
var list=[];
var hls=null;

function message(t){
 statusBox.textContent=t;
}

function proxyUrl(url){
 return worker+"?url="+encodeURIComponent(url);
}

function load(){
 fetch(source)
 .then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
 })
 .then(function(data){
  list=data.channels.filter(function(x){
   return x.stream_url && x.name_fa;
  });
  select.innerHTML="";
  list.forEach(function(ch,i){
   var op=document.createElement("option");
   op.value=i;
   op.textContent=ch.name_fa;
   select.appendChild(op);
  });
  var last=localStorage.getItem("lastChannel");
  if(last!==null && list[Number(last)])select.value=last;
  message("تعداد شبکه‌های دریافت‌شده: "+list.length);
 })
 .catch(function(e){
  message("خطا در دریافت فهرست: "+e.message);
 });
}

function play(){
 var ch=list[Number(select.value)];
 if(!ch)return;

 localStorage.setItem("lastChannel",select.value);

 if(hls){
  hls.destroy();
  hls=null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();

 message("در حال اتصال به "+ch.name_fa+" از طریق Worker...");

 if(window.Hls && Hls.isSupported()){
  var player=new Hls({
   enableWorker:false,
   debug:false
  });

  hls=player;

  player.on(Hls.Events.MEDIA_ATTACHED,function(){
   player.loadSource(proxyUrl(ch.stream_url));
  });

  player.on(Hls.Events.MANIFEST_PARSED,function(){
   if(hls!==player)return;
   message("فهرست پخش دریافت شد؛ در حال شروع...");
   video.play().then(function(){
    if(hls===player)message("در حال پخش: "+ch.name_fa);
   }).catch(function(e){
    if(hls===player)message("خطای شروع پخش: "+e.message);
   });
  });

  player.on(Hls.Events.ERROR,function(event,data){
   if(hls!==player)return;

   var responseCode=data.response && data.response.code;
   var failedUrl=data.url || (data.context && data.context.url) || "نامشخص";

   var details=
    "نوع: "+data.type+
    " | جزئیات: "+data.details+
    " | Fatal: "+data.fatal+
    " | HTTP: "+(responseCode || "نامشخص")+
    " | آدرس: "+failedUrl;

   message(details);

   if(data.fatal){
    player.destroy();
    if(hls===player)hls=null;
   }
  });

  player.attachMedia(video);

 }else if(video.canPlayType("application/vnd.apple.mpegurl")){
  video.src=proxyUrl(ch.stream_url);
  video.load();
  video.play().catch(function(e){
   message("خطای شروع پخش: "+e.message);
  });
 }else{
  message("مرورگر از پخش HLS پشتیبانی نمی‌کند.");
 }
}

function full(){
 if(video.requestFullscreen){
  video.requestFullscreen();
 }else if(video.webkitEnterFullscreen){
  video.webkitEnterFullscreen();
 }
}

video.onerror=function(){
 message("خطای دریافت یا رمزگشایی ویدیو.");
};

load();
</script>
</body>
</html>
